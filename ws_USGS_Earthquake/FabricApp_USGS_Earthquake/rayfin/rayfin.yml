id: fabricapp-usgs-earthquake
name: FabricApp_USGS_Earthquake
version: 1.0.0
services:
  connectors:
    enabled: true
  auth:
    enabled: true
    fabric:
      enabled: true
      externalEntraExchange: true
    password:
      enabled: false
    allowedRedirectUris:
      - http://localhost:5173
  data:
    enabled: true
    path: packages/data
    buildCommand: npm run build
    dialect: mssql
  staticHosting:
    enabled: true
    path: packages/frontend
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
    assetAccess: protected
    embedded:
      only: false
connectors:
  - name: lh_usgs_earthquake
    config:
      workspaceId: 39caa3ab-a964-45c2-bd5b-7d46ad66c985
      itemId: 229ffbb2-7c95-4ef9-836f-57b1083675c3
    auth:
      type: application
    operations:
      - name: read
    type: fabric-sqlanalytics
  - name: sm_usgs_earthquake
    type: fabric-semanticmodel
    config:
      workspaceId: 39caa3ab-a964-45c2-bd5b-7d46ad66c985
      itemId: 856acf3d-ddbc-4ed7-87a8-559018c12f05
    auth:
      type: delegated
    version: "1"
    operations:
      - name: executeQuery
